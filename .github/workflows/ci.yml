name: Validate timeline integrations
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,ai,databricks,collection,signing]'
      - name: Exercise the locked deployment dependencies
        if: matrix.python == '3.12'
        run: python -m pip install --require-hashes -r requirements/runtime-py312-linux.txt
      - run: ruff check src tests scripts streamlit_timeline_ui integrations/databricks
      - run: pytest -q
      - run: python scripts/check_notebooks.py --kernel
      - name: Check evaluation contracts and small scale workloads
        run: |
          python scripts/evaluate_quality.py --output /tmp/quality.json
          python scripts/benchmark.py --sizes 100 --output /tmp/scale.json
      - run: python -m build
      - name: Verify packaged resource files
        run: |
          python -c "from timeline_demo.ai import load_policy; assert len(load_policy()['tasks']) == 3"
          python scripts/check_wheel.py dist/*.whl
          timeline verify examples/demo_bundle
          timeline export-ocsf examples/demo_bundle --output output/ci-ocsf
          timeline verify-ocsf output/ci-ocsf --bundle examples/demo_bundle
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev,signing]' 'pyspark==3.5.3' 'delta-spark==3.2.1'
      - name: Verify Delta inserts, publication markers, and replay
        env:
          TIMELINE_TEST_DELTA: '1'
          SPARK_LOCAL_IP: '127.0.0.1'
        run: pytest -q tests/test_delta.py
  enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/build-py312.txt
      - run: python -m build --no-isolation
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned dependencies and create CycloneDX inventories
        run: |
          pip-audit --strict --disable-pip --require-hashes -r requirements/runtime-py312-linux.txt -f cyclonedx-json -o dist/runtime-sbom.json
          pip-audit --strict --disable-pip --require-hashes -r requirements/build-py312.txt -f cyclonedx-json -o dist/build-sbom.json
      - run: docker build --tag timeline:ci .
      - name: Exercise installed wheel as an unprivileged offline container
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:size=256m --tmpfs /data:uid=10001,gid=10001,mode=700,size=256m -v "$PWD/examples:/samples:ro" -v "$PWD/scripts:/checks:ro" --entrypoint python timeline:ci /checks/container_smoke.py
      - name: Record distribution hashes
        run: sha256sum dist/*.whl dist/*.tar.gz dist/*sbom.json > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeline-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 30
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, delta, enterprise, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: timeline-distribution
          path: dist
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
