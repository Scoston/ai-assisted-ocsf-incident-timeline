name: Build feature demo video
on:
  workflow_dispatch:
  push:
    branches: [demo-video-v013, main]
    paths:
      - '.github/workflows/demo-video.yml'
      - 'scripts/demo_video/**'
      - 'demos/v0.13.0/**'
permissions:
  contents: read
concurrency:
  group: demo-video-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[ui]' 'playwright==1.62.0'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/demo_video/capture_viewer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: demo-viewer-capture
          path: output/demo-video/capture/
          if-no-files-found: error
          retention-days: 30
      - name: Publish synthetic capture for video production
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zip -j output/viewer-capture.zip output/demo-video/capture/*
          if ! gh release view demo-v0.13.0 >/dev/null 2>&1; then
            gh release create demo-v0.13.0 --target "$GITHUB_SHA" --prerelease --latest=false --title 'v0.13.0 feature demo — production preview' --notes 'Synthetic viewer capture for the narrated feature demo. The completed video, captions and transcript will be added after review. No tenant data or credentials are included.'
          fi
          gh release upload demo-v0.13.0 "output/viewer-capture.zip#Synthetic viewer capture"
