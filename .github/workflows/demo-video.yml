name: Build feature demo video
on:
  workflow_dispatch:
  push:
    branches: [demo-video-v013, main]
    paths:
      - '.github/workflows/demo-video.yml'
      - 'scripts/demo_video/**'
      - 'demos/v0.13.0/**'
permissions:
  contents: read
concurrency:
  group: demo-video-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[ui]' 'playwright==1.62.0'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/demo_video/capture_viewer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: demo-viewer-capture
          path: output/demo-video/capture/
          if-no-files-found: error
          retention-days: 30
