[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-timeline-ai-demo"
version = "0.9.0"
description = "Evidence-preserving incident timelines with Tines, Databricks, and bounded AI analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
ai = ["openai>=1.109.1,<4"]
databricks = ["databricks-sdk>=0.60,<1"]
signing = ["cryptography>=46,<51"]
collection = ["requests>=2.32.3,<3", "boto3>=1.40,<2"]
parquet = ["pyarrow>=18,<26"]
notebooks = ["jupyterlab>=4,<5", "pandas>=2.2,<4", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
ui = ["streamlit>=1.52,<2", "pandas>=2.2,<4"]
ti = ["requests>=2.32.3,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "pyarrow>=18,<26", "PyYAML>=6,<7"]

[project.scripts]
timeline = "timeline_demo.cli:main"
timeline-sign = "timeline_demo.signing:main"
timeline-evaluate = "timeline_demo.evaluation:main"
timeline-databricks = "timeline_demo.integrations.databricks:job_main"
timeline-databricks-ocsf = "timeline_demo.integrations.databricks:ocsf_job_main"
timeline-databricks-inspect = "timeline_demo.integrations.databricks:inspect_job_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
timeline_demo = ["resources/*.json", "resources/ocsf/1.3.0/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"integrations/databricks/*.py" = ["F821"]
